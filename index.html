<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navakholo TerraHub Initiative - Credential Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo-group">
            <img src="Hub.png" alt="TerraHub Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/42?text=TH'">
            <div class="title-group">
                <h1>NAVAKHOLO TERRAHUB</h1>
                <p>FROM GROUND TO GREATNESS</p>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="scanner-card">
            <div class="scanner-header">
                <h2>Verify Student ID</h2>
                <p>Scan card camera or upload ID photo</p>
            </div>

            <div id="reader"></div>

            <div style="margin-top: 15px; text-align: center;">
                <label for="qrFileInput" class="btn" style="cursor: pointer; display: inline-block; width: auto; padding: 10px 16px;">
                    📂 Upload ID Card Image
                </label>
                <input type="file" id="qrFileInput" accept="image/*" style="display: none;" onchange="handleQrFileUpload(event)">
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
