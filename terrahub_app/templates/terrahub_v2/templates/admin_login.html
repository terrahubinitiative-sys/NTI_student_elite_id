<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Nakuru International College</title>
    <style>
        body {
            background-color: #070913;
            color: #f8fafc;
            font-family: 'Times New Roman', Times, serif;
            font-size: 12pt;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 8px;
            padding: 35px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
        }
        h2 {
            color: #f59e0b;
            font-size: 16pt;
            margin-top: 0;
            text-transform: uppercase;
        }
        label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            color: #cbd5e1;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            background: #0b0f19;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 5px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 12pt;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .btn-login {
            width: 100%;
            background: #f59e0b;
            color: #000;
            border: none;
            padding: 11px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 12pt;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .error {
            color: #ef4444;
            font-size: 11pt;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Admin Authentication</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <label>Username:</label>
            <input type="text" name="username" required autocomplete="off">
            
            <label>Password:</label>
            <input type="password" name="password" required>
            
            <button type="submit" class="btn-login">Secure Login</button>
        </form>
    </div>

</body>
</html>
