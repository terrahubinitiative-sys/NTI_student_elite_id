<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified Portfolio - Navakholo TerraHub Initiative</title>
    <style>
        body {
            background-color: #070913;
            color: #f8fafc;
            font-family: 'Times New Roman', Times, serif;
            font-size: 12pt;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-nav {
            width: 100%;
            max-width: 650px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }
        .btn-action {
            background: #38bdf8;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            font-size: 12pt;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-action:hover { background: #0ea5e9; }
        .portfolio-container {
            background: rgba(15, 23, 42, 0.95);
            color: #f8fafc;
            width: 100%;
            max-width: 650px;
            padding: 35px;
            box-sizing: border-box;
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h2 {
            color: #f59e0b;
            font-size: 16pt;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(245, 158, 11, 0.3);
            padding-bottom: 8px;
            margin-top: 0;
        }
        p {
            line-height: 1.6;
            margin: 12px 0;
        }
        @media print {
            body { background: #fff; color: #000; }
            .top-nav { display: none; }
            .portfolio-container { background: #fff; color: #000; border: 1px solid #000; box-shadow: none; width: 100%; max-width: 100%; }
            h2 { color: #000; border-bottom: 1px solid #000; }
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="/portal" class="btn-action">&larr; Back to Portal</a>
        <button onclick="window.print()" class="btn-action" style="background: #f59e0b;">Download PDF / Print</button>
    </div>

    <div class="portfolio-container">
        <h2>Verified Professional Portfolio</h2>
        <p><strong>Full Name:</strong> {{ record.full_name }}</p>
        <p><strong>Professional Title:</strong> {{ record.professional_title }}</p>
        <p><strong>Base Location:</strong> {{ record.location }}</p>
        <p><strong>GitHub Repository:</strong> {{ record.github }}</p>
        <p><strong>Executive Pitch:</strong> {{ record.executive_pitch }}</p>
        <div style="font-size: 10pt; color: #94a3b8; margin-top: 20px; font-family: monospace;">Record ID: {{ record.code }}</div>
    </div>

</body>
</html>
