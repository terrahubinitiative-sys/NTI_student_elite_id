<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel - Navkholo Terrahub</title>
    <style>
        :root {
            --bg-deep: #070913;
            --panel-bg: rgba(15, 23, 42, 0.90);
            --primary: #38bdf8;
            --accent-gold: #f59e0b;
        }

        body {
            background-color: var(--bg-deep);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
            margin-bottom: 8px;
            object-fit: cover;
        }

        h1 {
            font-size: 19px;
            letter-spacing: 1.5px;
            color: var(--accent-gold);
            margin: 5px 0;
        }

        .admin-card {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 14px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 5px;
        }

        label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 11px;
            background: #0b0f19;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.3);
        }

        .btn-save {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 25px;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: opacity 0.2s;
        }

        .btn-save:hover { opacity: 0.92; }

        .back-link {
            display: block;
            text-align: center;
            color: var(--primary);
            text-decoration: none;
            font-size: 12px;
            margin-top: 15px;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="header">
        <img src="{{ url_for('static', filename='Hub.png') }}" alt="Logo" onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=Terrahub'">
        <h1>ADMIN CONTROL PANEL</h1>
        <div style="font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px;">Navkholo Terrahub Directorate</div>
    </div>

    <div class="admin-card">
        <form method="POST">
            
            <div class="section-title" style="margin-top: 0;">Portal Statistics</div>
            <label>Students Enrolled</label>
            <input type="text" name="students_enrolled" value="{{ data.students_enrolled }}" required>

            <label>Students Earning / Working</label>
            <input type="text" name="students_earning" value="{{ data.students_earning }}" required>

            <div class="section-title">Project Milestones</div>
            <label>Current Project</label>
            <input type="text" name="current_project" value="{{ data.current_project }}" required>

            <label>Completed Projects</label>
            <input type="text" name="completed_project" value="{{ data.completed_project }}" required>

            <label>Upcoming Projects</label>
            <input type="text" name="upcoming_project" value="{{ data.upcoming_project }}" required>

            <div class="section-title">Social Media & Contact Links</div>
            <label>Facebook Link</label>
            <input type="text" name="facebook" value="{{ data.facebook }}" required>

            <label>Instagram Link</label>
            <input type="text" name="instagram" value="{{ data.instagram }}" required>

            <label>WhatsApp Link</label>
            <input type="text" name="whatsapp" value="{{ data.whatsapp }}" required>

            <label>Support Email</label>
            <input type="text" name="email" value="{{ data.email }}" required>

            <button type="submit" class="btn-save">Update Portal Data</button>
        </form>

        <a href="/" class="back-link">&larr; Return to Home Portal</a>
    </div>

</body>
</html>
