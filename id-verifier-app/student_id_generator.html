<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Student ID & Verifier Generator</title>
    <!-- Lightweight CDN Libraries (<50KB total) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary-blue: #0f2c59; --accent-blue: #0077b6; --gold-color: #f7b32b; --bg-color: #f4f7f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: #333; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h1 { color: var(--primary-blue); margin-bottom: 5px; font-size: 1.5rem; text-align: center; }
        p.subtitle { color: #666; margin-bottom: 20px; font-size: 0.9rem; text-align: center; }
        .container { display: flex; flex-wrap: wrap; gap: 30px; width: 100%; max-width: 900px; justify-content: center; }
        
        /* Auth & Form Cards */
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); flex: 1; min-width: 300px; max-width: 400px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: var(--primary-blue); }
        .form-group input { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
        .btn { width: 100%; background: var(--primary-blue); color: white; border: none; padding: 10px; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
        
        /* Preview & ID Card */
        .preview-section { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 320px; }
        .id-card { width: 350px; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); overflow: hidden; border: 1px solid #e0e0e0; position: relative; }
        .id-header { background: var(--accent-blue); color: #fff; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        .id-header-title { font-size: 0.85rem; font-weight: 700; }
        .badge-box { width: 24px; height: 24px; background: var(--gold-color); border-radius: 4px; }
        .id-body { padding: 15px; display: flex; gap: 15px; align-items: center; }
        .photo-frame { width: 90px; height: 115px; border: 2px solid var(--accent-blue); border-radius: 8px; overflow: hidden; background: #eee; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; }
        .details { flex-grow: 1; }
        .field-label { font-size: 0.6rem; color: #777; text-transform: uppercase; font-weight: 600; }
        .field-value { font-size: 0.85rem; color: var(--primary-blue); font-weight: 700; margin-bottom: 6px; word-break: break-word; }
        .status-badge { display: inline-block; background: #e6f4ea; color: #137333; font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 12px; margin-top: 4px; border: 1px solid #ceead6; }
        .id-footer { padding: 10px; background: #fafafa; border-top: 1px dashed #ddd; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #qrcode img { margin: 0 auto; }
        .scan-text { font-size: 0.65rem; color: #666; margin-top: 4px; font-weight: 600; }
    </style>
</head>
<body>

    <h1>Secure ID Generator & Verifier</h1>
    <p class="subtitle">The Smartphone Scientist - Offline First & Secure</p>

    <!-- Passcode Auth Section -->
    <div id="authCard" class="card" style="margin-bottom: 20px;">
        <div class="form-group">
            <label>Admin Passcode</label>
            <input type="password" id="adminPass" placeholder="Enter admin password">
        </div>
        <button class="btn" onclick="authenticate()">Unlock Generator</button>
        <p id="authErr" style="color: red; font-size: 0.8rem; margin-top: 8px; display: none;">Incorrect Passcode</p>
    </div>

    <!-- Generator Section (Hidden until authenticated) -->
    <div class="container" id="generatorContainer" style="display: none;">
        <div class="card">
            <div class="form-group">
                <label>Institution / School Name</label>
                <input type="text" id="inputSchool" value="KAGGLE" oninput="updateID()">
            </div>
            <div class="form-group">
                <label>Student Full Name</label>
                <input type="text" id="inputName" value="FELICIAN WANYAMA" oninput="updateID()">
            </div>
            <div class="form-group">
                <label>Degree / Course Program</label>
                <input type="text" id="inputProgram" value="PYTHON" oninput="updateID()">
            </div>
            <div class="form-group">
                <label>Student ID Number</label>
                <input type="text" id="inputIDNum" value="NTI-0005" oninput="updateID()">
            </div>
            <div class="form-group">
                <label>Valid Through</label>
                <input type="text" id="inputValid" value="DEC 2026" oninput="updateID()">
            </div>
            <div class="form-group">
                <label>Upload Student Photo</label>
                <input type="file" id="inputPhoto" accept="image/*" onchange="loadPhoto(event)">
            </div>
            <button class="btn" onclick="downloadIDAsPNG()">Download Card as PNG</button>
        </div>

        <!-- ID Card Preview -->
        <div class="preview-section">
            <div class="id-card" id="printableCard">
                <div class="id-header">
                    <div>
                        <div class="id-header-title" id="cardSchool">KAGGLE</div>
                        <div style="font-size:0.65rem; opacity:0.9;">OFFICIAL STUDENT ID</div>
                    </div>
                    <div class="badge-box"></div>
                </div>

                <div class="id-body">
                    <div class="photo-frame">
                        <img id="cardPhoto" src="" alt="Photo" style="display: none;">
                        <span id="photoPlaceholder" style="font-size: 0.7rem; color: #777; text-align: center;">Photo</span>
                    </div>
                    <div class="details">
                        <div class="field-label">Name</div>
                        <div class="field-value" id="cardName">FELICIAN WANYAMA</div>

                        <div class="field-label">Degree Program</div>
                        <div class="field-value" id="cardProgram">PYTHON</div>

                        <div class="field-label">Student ID</div>
                        <div class="field-value" id="cardIDNum">NTI-0005</div>

                        <div class="field-label">Valid Through</div>
                        <div class="field-value" id="cardValid">DEC 2026</div>

                        <div class="status-badge">ACTIVE STUDENT</div>
                    </div>
                </div>

                <div class="id-footer">
                    <div id="qrcode"></div>
                    <div class="scan-text">SCAN TO VERIFY AUTHENTICITY</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // SHA-256 Hash of "Admin123!" for client-side password verification
        const PASS_HASH = "f6c31f0e4b857503c1d47a32e391b0f55bb82121e7b952c1e7a4f783109a96e6"; 
        let currentVerifyToken = "";
        let qrcodeObj = null;

        async function hashPassword(str) {
            const buffer = new TextEncoder().encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function authenticate() {
            const inputPass = document.getElementById('adminPass').value;
            const inputHash = await hashPassword(inputPass);
            if (inputHash === PASS_HASH) {
                document.getElementById('authCard').style.display = 'none';
                document.getElementById('generatorContainer').style.display = 'flex';
                generateNewToken();
                updateID();
            } else {
                document.getElementById('authErr').style.display = 'block';
            }
        }

        function generateNewToken() {
            const array = new Uint8Array(8);
            crypto.getRandomValues(array);
            currentVerifyToken = Array.from(array, b => b.toString(16).padStart(2, '0')).join('');
        }

        function updateID() {
            document.getElementById('cardSchool').innerText = document.getElementById('inputSchool').value.toUpperCase();
            document.getElementById('cardName').innerText = document.getElementById('inputName').value.toUpperCase();
            document.getElementById('cardProgram').innerText = document.getElementById('inputProgram').value.toUpperCase();
            document.getElementById('cardIDNum').innerText = document.getElementById('inputIDNum').value.toUpperCase();
            document.getElementById('cardValid').innerText = document.getElementById('inputValid').value.toUpperCase();

            // Construct Verification Link
            const currentHost = window.location.origin + window.location.pathname.replace('student_id_generator.html', 'verify.html');
            const verifyURL = `${currentHost}?token=${currentVerifyToken}&id=${encodeURIComponent(document.getElementById('inputIDNum').value)}`;

            // Render QR Code
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = "";
            qrcodeObj = new QRCode(qrContainer, {
                text: verifyURL,
                width: 70,
                height: 70,
                colorDark: "#0f2c59",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // Store student record locally for verification page
            const record = {
                school: document.getElementById('inputSchool').value,
                name: document.getElementById('inputName').value,
                program: document.getElementById('inputProgram').value,
                id: document.getElementById('inputIDNum').value,
                valid: document.getElementById('inputValid').value,
                photo: document.getElementById('cardPhoto').src
            };
            localStorage.setItem(`student_${currentVerifyToken}`, JSON.stringify(record));
        }

        function loadPhoto(event) {
            let reader = new FileReader();
            reader.onload = function(){
                let output = document.getElementById('cardPhoto');
                output.src = reader.result;
                output.style.display = 'block';
                document.getElementById('photoPlaceholder').style.display = 'none';
                updateID();
            };
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        function downloadIDAsPNG() {
            let cardElement = document.getElementById('printableCard');
            html2canvas(cardElement, { scale: 3, useCORS: true }).then(canvas => {
                let link = document.createElement('a');
                link.download = document.getElementById('inputIDNum').value + '_verified_id.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // Refresh verification token for next student
                generateNewToken();
                updateID();
            });
        }
    </script>
</body>
</html>
