<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Student ID Verification</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #eef2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .verify-card { background: white; width: 90%; max-width: 380px; border-radius: 16px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; margin-bottom: 15px; }
        .badge-valid { background: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
        .badge-invalid { background: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
        .photo-circle { width: 100px; height: 100px; border-radius: 50%; overflow: hidden; margin: 0 auto 15px; border: 3px solid #0077b6; }
        .photo-circle img { width: 100%; height: 100%; object-fit: cover; }
        .field { text-align: left; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label { font-size: 0.7rem; color: #777; text-transform: uppercase; }
        .value { font-size: 0.95rem; font-weight: bold; color: #0f2c59; }
    </style>
</head>
<body>

    <div class="verify-card" id="cardContainer">
        <div id="loading">Verifying credential against official database...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        async function verify() {
            const container = document.getElementById('cardContainer');
            if (!token) {
                container.innerHTML = `<div class="badge badge-invalid">INVALID RECORD</div><h3>No verification token provided.</h3>`;
                return;
            }

            try {
                const res = await fetch(`/api/verify/${token}`);
                const data = await res.json();

                if (res.ok && data.valid) {
                    const s = data.student;
                    container.innerHTML = `
                        <div class="badge badge-valid">✓ OFFICIAL VERIFIED STUDENT</div>
                        <div class="photo-circle"><img src="${s.photo_url}" alt="Student Photo"></div>
                        <h2 style="margin:0 0 15px 0; color:#0f2c59;">${s.name}</h2>
                        
                        <div class="field"><div class="label">Institution</div><div class="value">${s.school}</div></div>
                        <div class="field"><div class="label">Program</div><div class="value">${s.program}</div></div>
                        <div class="field"><div class="label">Student ID</div><div class="value">${s.id}</div></div>
                        <div class="field"><div class="label">Valid Through</div><div class="value">${s.valid_through}</div></div>
                        <div class="field"><div class="label">Status</div><div class="value">${s.status}</div></div>
                    `;
                } else {
                    container.innerHTML = `<div class="badge badge-invalid">✗ UNVERIFIED / FRAUDULENT</div><h3>Record not found in system.</h3>`;
                }
            } catch (e) {
                container.innerHTML = `<div class="badge badge-invalid">ERROR</div><h3>Unable to complete verification.</h3>`;
            }
        }

        verify();
    </script>
</body>
</html>
